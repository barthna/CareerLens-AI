version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: careerlens-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: careerlens
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: careerlens-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/careerlens
      - JWT_SECRET=super_secure_jwt_secret_key_change_me_in_production_123456
      - JWT_REFRESH_SECRET=super_secure_jwt_refresh_secret_key_change_me_in_production_123456
      - FRONTEND_URL=http://localhost:3000
      - AI_API_KEY=
      - AI_MODEL=gemini-1.5-flash
    volumes:
      - ./backend/storage:/workspace/storage
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: careerlens-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    depends_on:
      - backend

volumes:
  postgres_data:
